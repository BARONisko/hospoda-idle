# Nasazení hry na GitHub Pages při každém pushi do main (hraní na mobilu v prohlížeči)
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:offline
      # hratelná složka HRA/ přímo v repu (stažené repo → HRA/index.html dvojklikem); commit tokenem Actions nespouští další běh
      - name: Aktualizovat složku HRA v repu
        run: |
          cp dist-offline/PUB-Idle/index.html dist-offline/PUB-Idle/JAK-SPUSTIT.txt HRA/
          cp public/icon.png HRA/
          if [ -n "$(git status --porcelain HRA)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add HRA && git commit -m "Složka HRA: aktuální hra do složky"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
